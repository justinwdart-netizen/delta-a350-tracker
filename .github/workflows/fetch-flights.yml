name: Fetch Delta A350 Flight Data

# UPDATED 2 Aug 2026: moved from once-daily to 4x/day now that the
# Aviationstack account is on the Basic paid tier (10,000 requests/month).
# fetch_flights.py now queries the FULL flight-number roster every run
# (56 flights x 4 runs/day x 30 days = 6,720/month, well under budget).
#
# Runs on a schedule and can also be triggered manually from the Actions tab.
on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC.
    # Previously: '0 13 * * *' (once daily). Adjust further if you want to
    # trade quota headroom for recency, or vice versa -- see the quota math
    # in fetch_flights.py's docstring before changing this.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      flight_number:
        description: 'Specific flight number to check (e.g. DL172). Leave blank to run the full roster instead.'
        required: false
        type: string

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch flight data
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MANUAL_FLIGHT_NUMBER: ${{ github.event.inputs.flight_number }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
