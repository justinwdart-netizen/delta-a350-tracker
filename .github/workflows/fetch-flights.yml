name: Fetch Delta A350 Flight Data

# Runs on a schedule (edit the cron below) and can also be triggered manually
# from the Actions tab in GitHub for testing.
on:
  schedule:
    # Default: once daily at 13:00 UTC (~22:00 JST / ~09:00 US Eastern).
    # Adjust to your preference. Cron is UTC regardless of your local time.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      flight_number:
        description: 'Specific flight number to check (e.g. DL172). Leave blank to run the normal rotation instead.'
        required: false
        type: string

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch flight data
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MANUAL_FLIGHT_NUMBER: ${{ github.event.inputs.flight_number }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
