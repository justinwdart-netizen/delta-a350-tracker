name: Fetch Delta A350 Flight Data

# STATUS (7 Aug 2026): the internal `schedule:` (cron) trigger has been
# REMOVED after live testing showed GitHub was not reliably honoring it.
#
# History, so the reasoning isn't lost:
#   - Started once-daily ('0 13 * * *'), moved to every-6h on the round
#     hour ('0 */6 * * *') when quota moved to Basic tier, then offset to
#     ('17 1,7,13,19 * * *') to dodge GitHub's busiest scheduling minute
#     after observing 2h40m-3h45m delays on the exact hour.
#   - Even after confirming (via direct file read on GitHub) that this
#     exact offset cron WAS the live file, runs kept landing ~2-2.5 hours
#     BEFORE their nearest intended slot — which a delay can't explain,
#     since cron can only fire late or not at all, never early — plus at
#     least one run failed outright with "job was not acquired by Runner
#     of type hosted even after multiple attempts". Conclusion: GitHub's
#     internal scheduled-workflow queue itself was the unreliable part,
#     not the cron expression.
#
# FIX: drop `schedule:` entirely. `workflow_dispatch` (already used for
# manual single-flight checks) is now the ONLY trigger, and an EXTERNAL
# scheduler (e.g. cron-job.org, a healthchecks.io-style pinger, or any
# always-on scheduler you control) calls GitHub's REST API on a timer to
# fire it directly:
#
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/fetch-flights-workflow.yml/dispatches
#   Headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <a fine-grained PAT with this repo's Actions: Read and write permission>
#     X-GitHub-Api-Version: 2022-11-28
#   Body (JSON):
#     {"ref": "main"}
#
# Target times: 10:17 / 16:17 / 22:17 / 04:17 JST (01:17 / 07:17 / 13:17 /
# 19:17 UTC) — leave the flight_number input out of the body (or send it
# empty) for a full-roster sweep, same as before. workflow_dispatch is a
# direct, immediately-executed API call rather than a queued internal
# trigger, so it isn't subject to the same delay/skip behavior that made
# `schedule:` unreliable here.
on:
  workflow_dispatch:
    inputs:
      flight_number:
        description: 'Specific flight number to check (e.g. DL172). Leave blank for the full 56-flight roster sweep instead.'
        required: false
        type: string

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch flight data
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MANUAL_FLIGHT_NUMBER: ${{ github.event.inputs.flight_number }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
