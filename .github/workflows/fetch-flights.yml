name: Fetch Delta A350 Flight Data

# Runs on a schedule (edit the cron below) and can also be triggered manually
# from the Actions tab in GitHub for testing.
on:
  schedule:
    # Basic tier (10,000 req/month) comfortably covers a full 56-flight
    # roster sweep 4x/day: 56 * 4 * 30 = 6,720/month, well under the cap.
    # Runs at 00:00 / 06:00 / 12:00 / 18:00 UTC -- adjust to your preference.
    # Cron is UTC regardless of your local time.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      flight_number:
        description: 'Specific flight number (e.g. DL172) for a single-flight check, or leave blank / type "ALL" for the full 56-flight sweep (~56 of your 10,000 monthly requests).'
        required: false
        type: string

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch flight data
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MANUAL_FLIGHT_NUMBER: ${{ github.event.inputs.flight_number }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
