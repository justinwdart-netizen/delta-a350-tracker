name: Fetch Delta A350 Flight Data

# STATUS (synced 3 Aug 2026): this file was out of sync with what's actually
# live in the repo. The account moved to Aviationstack's Basic tier
# (10,000 requests/month), fetch_flights.py was rewritten to sweep the FULL
# 56-flight roster on every automatic run, and the cron moved from once-daily
# to every 6 hours. This version also fixes a separate problem: exact
# 00:00/06:00/12:00/18:00 UTC are some of the most congested slots on
# GitHub's shared runners, which was causing multi-hour execution delays
# (observed: runs landing ~2h40m-3h45m late). Offsetting the minute/hour
# below reduces that queuing delay without changing the ~6-hour cadence.
#
# Runs on a schedule and can also be triggered manually from the Actions tab.
on:
  schedule:
    # Every 6 hours, offset off the round-hour marks to avoid GitHub's
    # busiest scheduling slots: 01:17 / 07:17 / 13:17 / 19:17 UTC
    # (~10:17 / 16:17 / 22:17 / 04:17 JST).
    # Previously: '0 */6 * * *' (00:00/06:00/12:00/18:00 UTC exactly) —
    # kept the same cadence, just moved off the most oversubscribed minute.
    # Before that: '0 13 * * *' (once daily, retired when quota moved to Basic).
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      flight_number:
        description: 'Specific flight number to check (e.g. DL172). Leave blank (or type "ALL") for the full 56-flight roster sweep instead.'
        required: false
        type: string

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch flight data
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MANUAL_FLIGHT_NUMBER: ${{ github.event.inputs.flight_number }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
